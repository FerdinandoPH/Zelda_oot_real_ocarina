# Builds and tests everything that does not need the baserom. On a v* tag it also publishes a GitHub release with
# the Mupen64Plus plugin (Linux, Windows) and the Pico firmware. The ROM patch (.bps) is added to the same release
# from a local machine with tools/make-release.sh, because building the ROM needs the (non-distributable) baserom.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PICO_SDK_VERSION: "2.3.0"
  LLVM_MINGW_VERSION: "20261006"

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Also checks that rom/audio-ocarina.patch still applies to the pinned zeldaret/oot commit
      - name: Set up the decomp with the hack applied
        run: tools/setup-oot.sh
      - name: Unit tests
        run: make -C tests test

  plugin-linux:
    # Oldest supported runner, so the plugin runs on distributions with an older glibc
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: tools/setup-oot.sh
      - name: Build
        run: make -C emulator/mupen64plus-input-ocarina -j"$(nproc)" package
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-linux
          path: emulator/mupen64plus-input-ocarina/build/zelda-oot-real-ocarina-mupen64plus-linux-x86_64.tar.gz

  plugin-windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: tools/setup-oot.sh
      - name: Install llvm-mingw
        run: |
          name=llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64
          curl -sSfL "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$name.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
      - name: Build
        run: make -C emulator/mupen64plus-input-ocarina CC=x86_64-w64-mingw32-gcc -j"$(nproc)" package
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-windows
          path: emulator/mupen64plus-input-ocarina/build-win64/zelda-oot-real-ocarina-mupen64plus-windows-x64.zip

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Cache Pico SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}
      - name: Fetch Pico SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "$PICO_SDK_VERSION" --recurse-submodules --shallow-submodules \
            https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
      - name: Build all boards
        run: PICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" firmware/pico/build.sh
      - name: Package
        run: |
          mkdir -p pkg/oru-firmware
          cp firmware/pico/dist/*.uf2 firmware/pico/README.md firmware/pico/README.es.md pkg/oru-firmware/
          cd pkg && python3 -m zipfile -c oru-firmware.zip oru-firmware
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: pkg/oru-firmware.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, plugin-linux, plugin-windows, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          | File | What it is |
          |------|------------|
          | `zelda-oot-real-ocarina-${{ github.ref_name }}.bps` | ROM patch. Apply it to **The Legend of Zelda: Ocarina of Time (USA) 1.0** in `.z64` format (SHA-1 `ad69c91157f6705e8ab06c79fe08aad47bb57ba7`) with [Rom Patcher JS](https://www.marcrobledo.com/RomPatcher.js/) or Floating IPS |
          | `zelda-oot-real-ocarina-mupen64plus-linux-x86_64.tar.gz` | Mupen64Plus plugin for Linux: emulates the ORU with your PC microphone. Run `install.sh` |
          | `zelda-oot-real-ocarina-mupen64plus-windows-x64.zip` | Mupen64Plus plugin for Windows: emulates the ORU with your PC microphone. Copy the `.dll` next to `mupen64plus-input-sdl.dll` |
          | `oru-firmware.zip` | Firmware for the ORU (Ocarina Recognition Unit), the Port 4 device for a real N64 (Pico, Pico W, Pico 2, Pico 2 W) |

          See the [README](https://github.com/${{ github.repository }}#readme) for details. No ROM is included.
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            zelda-oot-real-ocarina-mupen64plus-linux-x86_64.tar.gz
            zelda-oot-real-ocarina-mupen64plus-windows-x64.zip
            oru-firmware.zip
